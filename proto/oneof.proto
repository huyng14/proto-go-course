syntax = "proto3";

package example.oneof;

import "complex.proto";

option go_package = "github.com/Clement-Jean/proto-go-course/proto";

message Result {
  oneof result {
    string message = 1;
    uint32 id = 2;
    example.complex.Complex complexMsg = 3;
    example.complex.Dummy dummyMsg = 4;
  }
}